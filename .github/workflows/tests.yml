name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Синтаксис
        run: |
          shopt -s nullglob
          for file in public/js/*.js public/sw.js server/api.mjs tools/*.mjs tools/*.js tests/*.mjs; do
            node --check "$file"
          done

      - name: Расписание и калибровка
        run: node tests/cycle.mjs

      - name: Открытый API без пароля
        run: node tests/api.mjs
